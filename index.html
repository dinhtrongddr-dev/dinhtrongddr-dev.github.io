<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MI · Trợ lý thị trường crypto</title><meta name="robots" content="noindex">
<style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0e13;color:#e3e8ef;font:15px system-ui,sans-serif;text-align:center}a{color:#7c8cff}</style>
</head><body><div><p>Đang mở app…</p><p><a id="go" href="https://customers-smell-dover-realtor.trycloudflare.com">Bấm vào đây nếu không tự chuyển</a></p></div>
<script>
(function(){
  var fallback = "https://customers-smell-dover-realtor.trycloudflare.com";
  // device id kept on this stable address → the app stores this device's watchlist on the server under it
  var cid = null; try { cid = localStorage.getItem("mi.cid"); } catch (e) {}
  if (!cid || !/^[a-z0-9]{16,40}$/.test(cid)) { var a = new Uint8Array(12); crypto.getRandomValues(a); cid = Array.prototype.map.call(a, function (b) { return b.toString(36).padStart(2, "0"); }).join("").slice(0, 24); try { localStorage.setItem("mi.cid", cid); } catch (e) {} }
  function go(u){ var t = u.replace(/[/]+$/, "") + "/?cid=" + cid + location.hash; document.getElementById("go").href = t; location.replace(t); }
  fetch("link.json?t=" + Date.now(), { cache: "no-store" }).then(function(r){ return r.json(); })
    .then(function(j){ go(j.url || fallback); }).catch(function(){ go(fallback); });
})();
</script></body></html>
